[tools]
python = "3.14"
uv = "latest"

[tasks.sync]
description = "Create or update the locked development environment"
run = "uv sync --locked --all-extras"

[tasks.format]
description = "Format the project"
run = "uv run ruff format hexabyte tests"

[tasks.lint]
description = "Run lint and formatting checks"
run = """
uv run ruff check hexabyte tests
uv run ruff format --check hexabyte tests
"""

[tasks.typecheck]
description = "Run static type checks"
run = "uv run mypy hexabyte"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.build]
description = "Build source and wheel distributions"
run = "uv build"

[tasks.verify]
description = "Run all repository checks"
depends = ["lint", "typecheck", "test", "build"]

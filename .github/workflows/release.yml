name: (Pre-)Release

on:
  create:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  discussions: write

jobs:
  release:
    name: Create Package Release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@v9
    - name: Build package
      run: uv build
    - name: Create Pre-Release
      if: ${{ endsWith( github.ref_name, 'pre' )}}
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        prerelease: true
        files: |
          dist/*
    - name: Create Release
      if: ${{ !endsWith( github.ref_name, 'pre' )}}
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        prerelease: false
        files: |
          dist/*

[project]
name = "hexabyte"
version = "0.8.7"
description = "A modern, modular, and robust TUI hex editor."
authors = [
    { name = "Justin C", email = "justin@thetacom.info" },
]
readme = "docs/README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["commandline", "hexeditor", "binary", "hexadecimal", "raw", "byteview", "bytes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "hilbertcurve>=2.0.5",
    "munch>=4",
    "rich>=13.5",
    "textual>=0.53.1",
    "toml>=0.10.2",
]

[project.urls]
Repository = "https://github.com/thetacom/hexabyte"

[project.scripts]
hexabyte = "hexabyte.__main__:main"

[dependency-groups]
lint = ["ruff>=0.1"]
typecheck = ["mypy>=1.5", "types-toml>=0.10.8"]
test = ["pytest>=7.4", "pytest-cov>=4.1", "pytest-mock>=3.11"]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.coverage.run]
source = ["hexabyte"]
branch = true

[tool.pytest.ini_options]
minversion = "7.1"
addopts = "-ra --doctest-modules --cov --cov-branch --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["arg-type", "assignment", "attr-defined", "override"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E501"]
